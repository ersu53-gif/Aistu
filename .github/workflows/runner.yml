name: XAU V7.3 Perfect
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  sniper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: last_signal.json
          key: v73-${{ github.run_id }}
          restore-keys: v73-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas --quiet
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sleep $((RANDOM % 30 + 5))
          python main.py
      - name: Save anti-spam
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add last_signal.json || true
          git commit -m "spam lock" || true
          git push || true
